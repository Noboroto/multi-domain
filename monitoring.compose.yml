# Monitoring stack, split out of compose.yml for Coolify.
#
# compose.yml keeps the legacy Nginx Proxy Manager + Portainer topology and stays
# untouched as the rollback artefact. This file carries only the monitoring
# services. Prometheus reads monitoring.prometheus.yml, not prometheus.yml, which
# judge-server still uses through compose.yml.
#
# Notes for anyone editing this:
#   * Host paths are absolute and deliberate. Coolify clones the repo into its own
#     working directory, so a relative bind would point at an empty clone instead of
#     the live 132 MB Grafana / 586 MB Prometheus data. Both directories are owned by
#     1000:1000, which is why every service keeps `user: "0"`.
#   * No `networks:` block. Coolify puts all services of a resource on one network and
#     registers each compose SERVICE name as an alias, which is exactly what
#     prometheus.yml scrapes (`cadvisor:8080`, `node-exporter:9100`). Do not rename
#     these services.
#   * Images are pinned by digest: Coolify pulls on every deploy, and a moved `latest`
#     tag is how a monitoring stack silently loses its TSDB.
services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    cpus: 2
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl
    user: "0"
    privileged: true
    mem_limit: 256m
    expose:
      - 8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    cpus: 2
    user: "0"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    expose:
      - 9100
    restart: unless-stopped

  prometheus:
    image: prom/prometheus@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    cpus: 2
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=8GB
    expose:
      - 9090
    volumes:
      - /home/david0403/github/multi-domain/prometheus/data/config:/etc/prometheus
      - /home/david0403/github/multi-domain/monitoring.prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/david0403/github/multi-domain/prometheus/data/data:/prometheus
    restart: unless-stopped
    depends_on:
      - cadvisor

  # Probes the public sites listed in monitoring.prometheus.yml (job blackbox-http)
  # with the image's built-in `http_2xx` module, so no config file is mounted.
  # Reached only by Prometheus over the resource network; never published.
  blackbox-exporter:
    image: prom/blackbox-exporter@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
    cpus: 0.5
    mem_limit: 64m
    expose:
      - 9115
    restart: unless-stopped

  # Shared Loki for container logs of apps on this host (config:
  # monitoring/loki-config.yml, 30-day retention). Grafana reaches it over this
  # resource's own network as `monitoring-loki`; it is never published.
  monitoring-loki:
    image: grafana/loki:3.6.11@sha256:44148ad243c07957113baea950ee5ba9b0c8eff8d7e38ff3cc1c0af705790945
    cpus: 1
    mem_limit: 384m
    user: "10001"
    command:
      - -config.file=/etc/loki/config.yml
    expose:
      - 3100
    volumes:
      - /home/david0403/github/multi-domain/monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - /srv/appdata/monitoring/loki:/loki
    restart: unless-stopped

  # Ships logs of containers labelled `logging=david-alloy` to monitoring-loki
  # (config: monitoring/config.alloy). The Docker socket is read-only; the
  # storage path keeps read positions across recreates so logs are not shipped
  # twice.
  monitoring-alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    cpus: 0.5
    mem_limit: 192m
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - /home/david0403/github/multi-domain/monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /srv/appdata/monitoring/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - monitoring-loki

  grafana:
    networks: [default, observability]
    image: grafana/grafana@sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5
    cpus: 2
    user: "0"
    environment:
      - GF_SERVER_ROOT_URL=https://monitor.noboroto.id.vn
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    expose:
      - 3000
    volumes:
      - /home/david0403/github/multi-domain/grafana/data:/var/lib/grafana
    restart: always
    depends_on:
      - prometheus

# Shared, externally-created network that lets Grafana reach log backends owned by
# other stacks. Each Coolify resource otherwise gets its own isolated network, which
# silently broke the SPM Loki datasource after the migration: Grafana could no longer
# resolve it and every alert rule bound to that datasource fired as a DatasourceError.
# Declared as an ADDITIONAL network - the resource keeps its own default network so
# the reverse proxy can still route to it.
networks:
  observability:
    external: true
