# Shared Loki for apps on david-host (Coolify resource `monitoring`).
# Single tenant, local filesystem storage, 30-day retention. Based on the
# measured JudgeHub config (JudgeHub/monitoring/loki-config.yml), keeping its
# fixes:
#   * retention needs ALL THREE of limits_config.retention_period,
#     compactor.retention_enabled and compactor.delete_request_store, or the
#     compactor only compacts and never deletes;
#   * ingestion_rate_mb 2 / burst 4: a log storm, not retention, is what fills
#     the disk, and the root filesystem is shared with every app's database;
#   * ruler API off (no rules use it; it leaks paths and opens a write surface);
#   * discover_service_name off, so `service` is the only service label.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_cache_freshness_per_query: 10m
  split_queries_by_interval: 15m
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  allow_structured_metadata: true
  # 720h = 30 days.
  retention_period: 720h
  discover_service_name: []

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  enable_api: false
